<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="战争雷霆 Ground RB 完整队列自动预测。按国家、BR、挂载和版本追溯物理来源、交战条件与数据缺口。"><meta name="theme-color" content="#193248"><title>Ground Atlas · 强势队列预测与研究</title><link rel="stylesheet" href="styles.css"></head>
<body><a class="skip" href="#rankings">跳至队列结果</a><header><div class="masthead"><a class="brand" href="./">Ground Atlas</a><nav aria-label="研究工具" id="research-nav"><a href="research/index.html#tree">载具图鉴</a><a href="research/index.html#matrix">逐车对抗</a><a href="research/index.html#armor">防护研究</a><a href="research/index.html#lineup">我的队列</a></nav></div><div class="intro"><h1>下一场，从完整队列开始。</h1><p>在各自合法匹配环境中，寻找值得研发、能够连续出击的阵容。</p></div></header>
<main><section id="status" role="status" aria-live="polite">正在核对预测快照…</section><form class="controls" aria-label="筛选队列" onsubmit="return false"><label>版本<select id="version"></select></label><label>槽位 / 获取范围<select id="board"></select></label><label>国家<select id="nation"></select></label><label>Ground RB<select id="br"></select></label><label>技能情景<select id="skill"></select></label><label>任务偏好<select id="preference"></select></label><label>查看方式<select id="view"><option value="global">全局代表队列</option><option value="br">各 BR 最佳</option><option value="nation">各国最佳</option><option value="uptier">抗升房</option><option value="ground_only">纯地面</option><option value="combined_arms">空地协同</option></select></label></form>
<div class="workspace"><section id="rankings" aria-live="polite" aria-busy="true"></section><aside><h2>如何读这些结果</h2><p>分数是<strong>条件模型效用</strong>，不是胜率或击毁率。跨 BR 比较针对各队列自己的合法匹配环境。</p><p>物理缺项区间不是统计置信区间。模型误差和样本外置信度单独列出；没有校准数据时保持未知。</p><details open><summary>发布条件与数据覆盖</summary><div id="coverage"></div></details><details><summary>版本、来源与算法</summary><div id="method"></div></details></aside></div><label class="movement-filter">版本变化方向<select id="movement-direction"><option value="all">全部变化</option><option value="rising">上升 / 黑马候选</option><option value="falling">衰退</option><option value="unavailable">不可迁移 / 证据不足</option></select></label><section id="movements"></section><details><summary>原生距离的单发技能诊断</summary><div id="diagnostics"></div></details></main><footer>独立爱好者项目，与 Gaijin Entertainment 无隶属关系。所有假设与数据限制随版本保留。</footer><script type="module" src="app.mjs"></script></body></html>
